# ==============================================================================
# Nginx Virtual Host for AirPairy / WiFi Billing (Blue-Green Configuration)
# Domain: app.qticket.dev
# ==============================================================================

# Include dynamic active upstream definition (switched atomically by deploy script)
include /etc/nginx/conf.d/upstream-active.conf;

# Port 80 HTTP — Router-facing endpoints, ACME challenge & HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.qticket.dev qticket.dev 81.17.101.222;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }

    # Retired router provisioning endpoints — HTTP 410 Gone (Preserve legacy protection)
    include /etc/nginx/airpairy-retired-setup.conf;

    # Router-facing endpoints (telemetry, setup scripts) — plain HTTP support for RouterOS /tool fetch
    location /api/router/ {
        proxy_pass http://active-backend/api/router/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # All dashboard, browser, and payment traffic is redirected to HTTPS
    location / {
        return 301 https://app.qticket.dev$request_uri;
    }
}

# Port 443 HTTPS — Zero-Downtime Blue-Green Application Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.qticket.dev;

    ssl_certificate     /etc/letsencrypt/live/app.qticket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.qticket.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "0" always;

    client_max_body_size 5m;
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Retired router provisioning endpoints — HTTP 410 Gone
    include /etc/nginx/airpairy-retired-setup.conf;

    # Persistent Next.js hashed static assets — served directly from shared pool
    # Ensures open browser tabs on older releases never experience 404 ChunkLoadErrors
    location /_next/static/ {
        alias /var/www/wifi-billing/shared-static/;
        expires 365d;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Direct backend API mapping
    location /api/ {
        proxy_pass http://active-backend/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    # Next.js Application Proxy
    location / {
        proxy_pass http://active-frontend;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}
