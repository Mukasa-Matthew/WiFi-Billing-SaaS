# --- AirPairy: retired router setup endpoints -------------------------------
# These routes released credential-bearing setup scripts and accepted WireGuard
# key registration using the router's public portal id. Refuse them at the edge
# regardless of which backend version is running. Deployed routers never call
# them; their recurring routes (management.rsc, acks, hosts, telemetry) and the
# captive portal are deliberately not matched.
location ~* ^/api/router/provision/[^/]+/?$ {
    access_log /var/log/nginx/airpairy-retired-setup.log airpairy_redacted;
    return 410;
}
location ~* ^/api/router/provision/[^/]+/(register|complete|install-management\.rsc)/?$ {
    access_log /var/log/nginx/airpairy-retired-setup.log airpairy_redacted;
    return 410;
}
