# Bootstrap config — install this FIRST at /etc/nginx/conf.d/airpairy.conf,
# then run:  sudo certbot --nginx -d app.qticket.dev
# Certbot issues the certs and rewrites this file with proper :443 blocks.
# Afterwards replace it with the hardened qticket.dev.conf.

server {
    listen 80;
    listen [::]:80;
    server_name app.qticket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    # Serve the app on plain HTTP only long enough for the cert challenge.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
