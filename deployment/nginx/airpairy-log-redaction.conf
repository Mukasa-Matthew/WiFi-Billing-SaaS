# --- AirPairy: keep router ids and setup codes out of access logs ------------
# (http context) Everything between the route prefix and a known trailing
# action is replaced, whatever the casing, repeated slashes or dot-segments.
# Query strings are dropped from the logged URI (portal ?token= included).
map $request_uri $airpairy_safe_uri {
    "~*^(?<p>/+api/+(?:router/+(?:provision|setup)|portal/+assets)/+)[^?]*?(?<rest>/+(?:management\.rsc|bindings-ack|tasks/+[0-9]+/+ack|hosts|register|complete|install-management\.rsc|logo|background))?/*(?:\?.*)?$" "${p}<redacted>${rest}";
    "~^(?<p>[^?]*)" "$p";
}
log_format airpairy_redacted '$remote_addr - [$time_local] "$request_method $airpairy_safe_uri" $status $body_bytes_sent "$http_user_agent"';
