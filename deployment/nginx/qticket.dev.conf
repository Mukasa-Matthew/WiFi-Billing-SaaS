# AirPairy — temporary domain vhost (app.qticket.dev)
# Single-origin architecture: frontend and /api share the hostname.
# Deploy to /etc/nginx/sites-available/airpairy and symlink to sites-enabled.
# Obtain the certificate BEFORE enabling the :443 block:
#   sudo certbot --nginx -d app.qticket.dev -d qticket.dev
# .dev is HSTS-preloaded — HTTPS is mandatory.

# :80 — ACME challenge + permanent redirect
server {
    listen 80;
    listen [::]:80;
    server_name app.qticket.dev qticket.dev;

    location /.well-known/acme-challenge/ {
        root /var/www/acme;
    }
    location / {
        return 301 https://app.qticket.dev$request_uri;
    }
}

# :443 — apex redirects to the app subdomain
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name qticket.dev;

    ssl_certificate     /etc/letsencrypt/live/app.qticket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.qticket.dev/privkey.pem;

    return 301 https://app.qticket.dev$request_uri;
}

# :443 — application
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.qticket.dev;

    ssl_certificate     /etc/letsencrypt/live/app.qticket.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.qticket.dev/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers (no HSTS includeSubDomains yet — add once stable).
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-XSS-Protection "0" always;

    client_max_body_size 2m;

    # Long timeout for MarzPay callbacks + router fetches
    proxy_connect_timeout 10s;
    proxy_read_timeout    60s;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Next.js app — its /api/[...path] route proxies internally to the backend,
    # so everything on this origin is same-site for the browser.
    location / {
        proxy_pass http://127.0.0.1:3000;
    }
}

# --- Migration safety: keep the bare IP answering during cutover ---
# Existing routers and in-flight MarzPay callbacks still target
# http://81.17.101.222 — leave the existing IP vhost running until every
# router has been re-provisioned with the app.qticket.dev base URL and
# MarzPay callbacks are confirmed hitting the domain.
