server.port=${SERVER_PORT:8080}
server.address=${SERVER_ADDRESS:127.0.0.1}

# PostgreSQL Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5439/radius_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:radius_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT Security
jwt.secret=${JWT_SECRET:}
jwt.expiration-hours=${JWT_EXPIRATION_HOURS:24}

# WireGuard Server Metadata
wireguard.server.endpoint=${WIREGUARD_SERVER_ENDPOINT:127.0.0.1:443}
wireguard.server.public-key=${WIREGUARD_SERVER_PUBLIC_KEY:}
wireguard.server.subnet=${WIREGUARD_SERVER_SUBNET:10.9.0.0/16}
radius.server.ip=${RADIUS_SERVER_IP:10.9.0.1}
radius.default.secret=${RADIUS_DEFAULT_SECRET:}

# Provisioning (must be reachable by routers over the public internet)
provisioning.public-base-url=${PROVISIONING_PUBLIC_BASE_URL:http://127.0.0.1:8080}
# Public IP of cloudserv, whitelisted in the hotspot walled garden (optional)
provisioning.server-public-ip=${PROVISIONING_SERVER_PUBLIC_IP:}

# WireGuard hub peer management (enable on cloudserv; requires sudoers entry for wg)
wireguard.server.interface=${WIREGUARD_SERVER_INTERFACE:wg0}
wireguard.peer-management.enabled=${WIREGUARD_PEER_MANAGEMENT_ENABLED:false}
wireguard.peer-management.use-sudo=${WIREGUARD_PEER_MANAGEMENT_USE_SUDO:true}
wireguard.peer-management.wg-binary=${WIREGUARD_PEER_MANAGEMENT_WG_BINARY:/usr/bin/wg}
wireguard.peer-management.ssh-target=${WIREGUARD_PEER_MANAGEMENT_SSH_TARGET:}

# Telemetry: mark routers offline after this many minutes without a report
telemetry.offline-after-minutes=${TELEMETRY_OFFLINE_AFTER_MINUTES:6}

# Payment Gateway Configuration
payment.gateway.mode=${PAYMENT_GATEWAY_MODE:mock}
payment.gateway.mock.auto-approve-seconds=${PAYMENT_GATEWAY_MOCK_AUTO_APPROVE_SECONDS:5}
payment.walled-garden.hosts=${PAYMENT_WALLED_GARDEN_HOSTS:proxy.momoapi.mtn.com,openapi.airtel.africa,api.flutterwave.com}
payment.webhook.secret=${PAYMENT_WEBHOOK_SECRET:}

# Optional one-time superadmin bootstrap. Leave empty after the account exists.
bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Platform Superadmin}

# Comma-separated browser origins for cross-origin development. Production uses same-origin /api routes.
security.cors.allowed-origins=${SECURITY_CORS_ALLOWED_ORIGINS:}

# HikariCP Connection Pool (Tailscale / Remote Connection Optimization)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.validation-timeout=5000

# MarzPay integration
marzpay.api-base=${MARZPAY_API_BASE:https://wallet.wearemarz.com/api/v1}
marzpay.platform.api-key=${MARZPAY_PLATFORM_API_KEY:}
marzpay.platform.api-secret=${MARZPAY_PLATFORM_API_SECRET:}
marzpay.platform.webhook-secret=${MARZPAY_PLATFORM_WEBHOOK_SECRET:}
marzpay.platform.country=${MARZPAY_PLATFORM_COUNTRY:UG}
marzpay.platform.fee-percent=${MARZPAY_PLATFORM_FEE_PERCENT:3.0}

# AES-GCM key for tenant gateway credentials (base64, 32 bytes). Falls back to a
# key derived from JWT_SECRET when unset.
app.encryption-key=${APP_ENCRYPTION_KEY:}

# Tenant withdrawals — live payouts stay disabled until operations are verified.
withdrawals.require-approval=${WITHDRAWALS_REQUIRE_APPROVAL:true}
withdrawals.live-payouts=${WITHDRAWALS_LIVE_PAYOUTS:false}
withdrawals.min-amount=${WITHDRAWALS_MIN_AMOUNT:1000}
withdrawals.max-amount=${WITHDRAWALS_MAX_AMOUNT:5000000}
withdrawals.max-open-per-tenant=${WITHDRAWALS_MAX_OPEN_PER_TENANT:1}

# Platform earnings wallet & payouts (super admin)
platform.payouts.enabled=${PLATFORM_PAYOUTS_ENABLED:false}
platform.payout.max-amount=${PLATFORM_PAYOUT_MAX_AMOUNT:5000000}
platform.reconcile.tolerance=${PLATFORM_RECONCILE_TOLERANCE:1000}
platform.reconcile.buffer=${PLATFORM_RECONCILE_BUFFER:5000}
platform.reconcile.interval-ms=${PLATFORM_RECONCILE_INTERVAL_MS:300000}
platform.balance.max-staleness-minutes=${PLATFORM_BALANCE_MAX_STALENESS_MINUTES:10}
