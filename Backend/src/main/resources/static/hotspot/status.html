<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TENANT_NAME_PLACEHOLDER - Connection Status</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            max-width: 400px;
            width: 100%;
            padding: 40px;
            text-align: center;
        }
        .icon { font-size: 4rem; margin-bottom: 20px; }
        h1 { color: #333; margin-bottom: 20px; }
        .stats { background: #f7fafc; border-radius: 10px; padding: 20px; margin-bottom: 20px; text-align: left; }
        .stat-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #e2e8f0; }
        .stat-row:last-child { border-bottom: none; }
        .stat-label { color: #666; }
        .stat-value { font-weight: 600; color: #333; }
        .btn {
            display: inline-block; padding: 15px 30px; background: #e53e3e; color: white;
            border: none; border-radius: 10px; font-size: 1rem; font-weight: 600;
            cursor: pointer; text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">✅</div>
        <h1>Connection Status</h1>
        <div class="stats">
            <div class="stat-row">
                <span class="stat-label">Username:</span>
                <span class="stat-value">$(username)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">IP Address:</span>
                <span class="stat-value">$(ip)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Session Time:</span>
                <span class="stat-value">$(uptime)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Downloaded:</span>
                <span class="stat-value">$(bytes-in-nice)</span>
            </div>
            <div class="stat-row">
                <span class="stat-label">Uploaded:</span>
                <span class="stat-value">$(bytes-out-nice)</span>
            </div>
        </div>
        <a href="$(link-logout)" class="btn">Logout</a>
    </div>
</body>
</html>
