<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="pragma" content="no-cache">
    <meta http-equiv="expires" content="-1">
    <title>Redirecting to TENANT_NAME_PLACEHOLDER...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .loader { text-align: center; }
        .spinner {
            width: 50px; height: 50px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <h2>Connecting to WiFi Portal...</h2>
        <p>Please wait while we redirect you.</p>
    </div>

    <script>
        var portalUrl = 'SERVER_BASE_URL_PLACEHOLDER/api/portal/page';
        var params = [];

        var mac = '$(mac)';
        var ip = '$(ip)';
        var username = '$(username)';
        var linkLogin = '$(link-login-only)';
        var linkOrig = '$(link-orig)';
        var error = '$(error)';

        params.push('token=ROUTER_TOKEN_PLACEHOLDER');
        params.push('mac=' + encodeURIComponent(mac !== '$(mac)' ? mac : ''));
        params.push('ip=' + encodeURIComponent(ip !== '$(ip)' ? ip : ''));
        if (username && username !== '$(username)') params.push('username=' + encodeURIComponent(username));
        if (linkLogin && linkLogin !== '$(link-login-only)') params.push('link-login-only=' + encodeURIComponent(linkLogin));
        if (linkOrig && linkOrig !== '$(link-orig)') params.push('link-orig=' + encodeURIComponent(linkOrig));
        if (error && error !== '$(error)' && error !== '') params.push('error=' + encodeURIComponent(error));

        window.location.href = portalUrl + '?' + params.join('&');
    </script>

    <noscript>
        <meta http-equiv="refresh" content="0; url=SERVER_BASE_URL_PLACEHOLDER/api/portal/page?token=ROUTER_TOKEN_PLACEHOLDER&amp;mac=$(mac)&amp;ip=$(ip)&amp;link-login-only=$(link-login-only)&amp;link-orig=$(link-orig)">
    </noscript>
</body>
</html>
