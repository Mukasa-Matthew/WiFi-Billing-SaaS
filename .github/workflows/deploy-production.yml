name: Production Blue-Green Deployment

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Exact Git Commit SHA to deploy (must match main HEAD or be explicitly authorized)'
        required: true
      confirm_production_release:
        description: 'Type "DEPLOY" to confirm release to production'
        required: true
        default: 'NO'
      allow_rollback_deployment:
        description: 'Set to "YES" ONLY if intentionally deploying an older commit for rollback'
        required: false
        default: 'NO'

# To activate automatic zero-downtime deployment after review & approval, replace 'workflow_dispatch' with:
# on:
#   workflow_run:
#     workflows: ["Continuous Integration"]
#     branches: [main]
#     types: [completed]

concurrency:
  group: production-deploy
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  verify-and-deploy:
    name: Verify Tested Artifacts, Tailscale Connect & Trigger Blue-Green Release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify Explicit Approval Confirmation
        run: |
          if [ "${{ github.event.inputs.confirm_production_release }}" != "DEPLOY" ]; then
            echo "ERROR: Production release cancelled. You must enter 'DEPLOY' to approve."
            exit 1
          fi

      - name: Validate Commit SHA Format
        id: parse_sha
        run: |
          COMMIT="${{ github.event.inputs.target_commit }}"
          if [[ ! "${COMMIT}" =~ ^[0-9a-fA-F]{7,40}$ ]]; then
            echo "ERROR: Invalid Git commit SHA format: ${COMMIT}"
            exit 1
          fi
          echo "commit=${COMMIT}" >> $GITHUB_OUTPUT

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify Strict Stale-Release Protection
        env:
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
          ALLOW_ROLLBACK: ${{ github.event.inputs.allow_rollback_deployment }}
        run: |
          CURRENT_MAIN_HEAD=$(git rev-parse origin/main)
          RESOLVED_COMMIT=$(git rev-parse "${COMMIT}")
          echo "Current origin/main HEAD : ${CURRENT_MAIN_HEAD}"
          echo "Target Deployment Commit : ${RESOLVED_COMMIT}"

          # 1. Enforce that commit exists on main
          if ! git merge-base --is-ancestor "${RESOLVED_COMMIT}" origin/main; then
            echo "SECURITY ERROR: Commit ${RESOLVED_COMMIT} is NOT on the main branch! Deployment aborted."
            exit 1
          fi

          # 2. Enforce that commit is the latest main HEAD unless explicitly flagged as rollback
          if [ "${RESOLVED_COMMIT}" != "${CURRENT_MAIN_HEAD}" ]; then
            if [ "${ALLOW_ROLLBACK}" != "YES" ]; then
              echo "SECURITY ERROR: Target commit ${RESOLVED_COMMIT} is NOT current main HEAD (${CURRENT_MAIN_HEAD})!"
              echo "Automatic and standard releases reject stale or superseded commits."
              echo "If this is an intentional emergency rollback, set allow_rollback_deployment=YES."
              exit 1
            else
              echo "NOTICE: Deploying older commit ${RESOLVED_COMMIT} under authorized rollback override."
            fi
          else
            echo "Verification successful: Target commit matches current main HEAD."
          fi

      - name: Verify Successful CI Build for Target Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Verifying CI check runs for commit: ${COMMIT}"
          CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/${COMMIT}/check-runs)
          
          BACKEND_STATUS=$(echo "${CHECK_RUNS}" | jq -r '.check_runs[] | select(.name | contains("Backend Build")) | .conclusion' | head -n 1)
          FRONTEND_STATUS=$(echo "${CHECK_RUNS}" | jq -r '.check_runs[] | select(.name | contains("Frontend Build")) | .conclusion' | head -n 1)

          if [ "${BACKEND_STATUS}" != "success" ] || [ "${FRONTEND_STATUS}" != "success" ]; then
            echo "ERROR: Both Backend and Frontend builds must have passed CI!"
            echo "Backend CI: ${BACKEND_STATUS}"
            echo "Frontend CI: ${FRONTEND_STATUS}"
            exit 1
          fi
          echo "CI check runs verified: Both Backend and Frontend passed."

      - name: Download Immutable Build Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          mkdir -p artifacts
          echo "Finding CI run for commit ${COMMIT}..."
          RUN_ID=$(gh run list --commit "${COMMIT}" --workflow "Continuous Integration" --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -n 1)
          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: Could not locate successful Continuous Integration run for commit ${COMMIT}!"
            exit 1
          fi
          echo "Downloading artifacts from CI Run ID: ${RUN_ID}..."
          gh run download "${RUN_ID}" --dir artifacts/

          echo "Inspecting downloaded artifacts:"
          ls -la artifacts/*

      - name: Connect to Tailscale Private Network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-deployer

      - name: Configure Known Hosts with Pinned SSH Key
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          PINNED_HOST_KEY: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${PINNED_HOST_KEY}" ]; then
            echo "${PINNED_HOST_KEY}" >> ~/.ssh/known_hosts
            echo "Using repository-pinned SSH host key."
          else
            echo "WARNING: PROD_SSH_KNOWN_HOSTS not configured. Falling back to dynamic keyscan over Tailscale."
            ssh-keyscan -H "${APP_HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Set up SSH Key for Deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}

      - name: Pre-Cutover Remote State Revalidation
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Revalidating remote server deployment infrastructure on ${APP_HOST}..."
          # Confirm /opt/airpairy/deployment exists and is accessible
          ssh -o BatchMode=yes "${APP_HOST}" "test -f /opt/airpairy/deployment/blue-green/blue-green-deploy.sh" || {
            echo "ERROR: /opt/airpairy/deployment infrastructure not found on target host! Run Approval A setup first." >&2
            exit 1
          }

      - name: Secure Artifact Transfer & Atomic Blue-Green Release
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Transferring verified immutable artifacts to ${APP_HOST}..."
          REMOTE_TMP="/home/matthew/.deploy-staging-${COMMIT}"
          
          ssh -o BatchMode=yes "${APP_HOST}" "mkdir -p ${REMOTE_TMP}"
          
          # Transfer backend and frontend artifacts
          scp -o BatchMode=yes artifacts/backend-jar-*/api-0.0.1-SNAPSHOT.jar "${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/backend-jar-*/backend.sha256 "${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/frontend-bundle-*/frontend-standalone.tar.gz "${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/frontend-bundle-*/frontend.sha256 "${APP_HOST}:${REMOTE_TMP}/"
          
          echo "Executing atomic staging and blue-green cutover via /opt/airpairy/deployment on ${APP_HOST}..."
          ssh -o BatchMode=yes "${APP_HOST}" \
            "/opt/airpairy/deployment/blue-green/stage-release-artifacts.sh '${COMMIT}' '${REMOTE_TMP}' && \
             /opt/airpairy/deployment/blue-green/blue-green-deploy.sh '${COMMIT}' 60 && \
             rm -rf ${REMOTE_TMP}"
