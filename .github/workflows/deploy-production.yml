name: Production Deployment (Atomic Blue-Green)

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Git Commit SHA on main branch to deploy (must have passed CI)'
        required: true
      allow_rollback_deployment:
        description: 'Set to YES to permit deploying an older commit than currently deployed'
        required: false
        default: 'NO'

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Validate Target Commit
        id: parse_sha
        env:
          INPUT_COMMIT: ${{ github.event.inputs.target_commit }}
          ALLOW_ROLLBACK: ${{ github.event.inputs.allow_rollback_deployment }}
        run: |
          echo "Resolving target commit ${INPUT_COMMIT}..."
          RESOLVED_COMMIT=$(git rev-parse --verify "${INPUT_COMMIT}^{commit}" 2>/dev/null || true)
          if [ -z "${RESOLVED_COMMIT}" ]; then
            echo "ERROR: Target commit '${INPUT_COMMIT}' could not be resolved!"
            exit 1
          fi

          echo "commit=${RESOLVED_COMMIT}" >> $GITHUB_OUTPUT

          # Ensure commit exists on origin/main
          if ! git merge-base --is-ancestor "${RESOLVED_COMMIT}" origin/main; then
            echo "SECURITY VIOLATION: Target commit ${RESOLVED_COMMIT} is NOT on origin/main branch! Aborting."
            exit 1
          fi

          # Strict Freshness Enforcement: Regular deployment must match current main HEAD
          CURRENT_MAIN_HEAD=$(git rev-parse origin/main)
          echo "Current origin/main HEAD : ${CURRENT_MAIN_HEAD}"
          echo "Target deployment commit : ${RESOLVED_COMMIT}"

          if [ "${RESOLVED_COMMIT}" != "${CURRENT_MAIN_HEAD}" ]; then
            if [ "${ALLOW_ROLLBACK}" = "YES" ]; then
              echo "WARNING: Deploying historical commit (${RESOLVED_COMMIT}) that differs from main HEAD (${CURRENT_MAIN_HEAD}). Explicit rollback flag YES provided."
            else
              echo "STALE COMMIT REJECTED: Candidate commit ${RESOLVED_COMMIT} does not match current main HEAD ${CURRENT_MAIN_HEAD}!"
              echo "To deploy an older commit, you must explicitly set allow_rollback_deployment=YES."
              exit 1
            fi
          else
            echo "Freshness verified: Target commit matches latest origin/main HEAD."
          fi

      - name: Verify CI Build & Test Status for Commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Checking CI conclusion for commit ${COMMIT}..."
          BACKEND_STATUS=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}/check-runs" \
            -q '.check_runs[] | select(.name=="Backend Build & Tests (Spring Boot)") | .conclusion' | head -n 1)
          FRONTEND_STATUS=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}/check-runs" \
            -q '.check_runs[] | select(.name=="Frontend Build & TypeScript Validation (Next.js)") | .conclusion' | head -n 1)

          echo "Backend CI conclusion  : ${BACKEND_STATUS}"
          echo "Frontend CI conclusion : ${FRONTEND_STATUS}"

          if [ "${BACKEND_STATUS}" != "success" ] || [ "${FRONTEND_STATUS}" != "success" ]; then
            echo "SECURITY VIOLATION: Cannot deploy commit ${COMMIT} because required CI checks are not passing!"
            exit 1
          fi
          echo "CI check runs verified: Both Backend and Frontend passed."

      - name: Download Immutable Build Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          mkdir -p artifacts
          echo "Finding CI run for commit ${COMMIT}..."
          RUN_ID=$(gh run list --commit "${COMMIT}" --workflow "Continuous Integration" --json databaseId,conclusion -q '.[] | select(.conclusion=="success") | .databaseId' | head -n 1)
          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: Could not locate successful Continuous Integration run for commit ${COMMIT}!"
            exit 1
          fi
          echo "Downloading artifacts from CI Run ID: ${RUN_ID}..."
          gh run download "${RUN_ID}" --dir artifacts/

          echo "Inspecting downloaded artifacts:"
          ls -la artifacts/*

      - name: Connect to Tailscale Private Network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-deployer

      - name: Configure Known Hosts with Pinned SSH Key
        env:
          PINNED_HOST_KEY: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${PINNED_HOST_KEY}" ]; then
            echo "CRITICAL SECURITY ERROR: PROD_SSH_KNOWN_HOSTS secret is missing! Failing closed." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${PINNED_HOST_KEY}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Verified and installed repository-pinned SSH host key."

      - name: Set up SSH Key for Deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}

      - name: Pre-Cutover Remote State Revalidation
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          DEPLOY_USER: "matthew"
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Revalidating remote server deployment infrastructure on ${APP_HOST}..."
          ssh -o BatchMode=yes "${DEPLOY_USER}@${APP_HOST}" "test -f /opt/airpairy/deployment/blue-green/blue-green-deploy.sh" || {
            echo "ERROR: /opt/airpairy/deployment infrastructure not found on target host! Run Approval A setup first." >&2
            exit 1
          }

      - name: Secure Artifact Transfer & Atomic Blue-Green Release
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          DEPLOY_USER: "matthew"
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Transferring verified immutable artifacts to ${APP_HOST}..."
          REMOTE_TMP="/home/${DEPLOY_USER}/.deploy-staging-${COMMIT}"
          
          ssh -o BatchMode=yes "${DEPLOY_USER}@${APP_HOST}" "mkdir -p ${REMOTE_TMP}"
          
          # Transfer backend and frontend artifacts
          scp -o BatchMode=yes artifacts/backend-jar-*/api-0.0.1-SNAPSHOT.jar "${DEPLOY_USER}@${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/backend-jar-*/backend.sha256 "${DEPLOY_USER}@${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/frontend-bundle-*/frontend-standalone.tar.gz "${DEPLOY_USER}@${APP_HOST}:${REMOTE_TMP}/"
          scp -o BatchMode=yes artifacts/frontend-bundle-*/frontend.sha256 "${DEPLOY_USER}@${APP_HOST}:${REMOTE_TMP}/"
          
          echo "Executing atomic staging and blue-green cutover via /opt/airpairy/deployment on ${APP_HOST}..."
          ssh -o BatchMode=yes "${DEPLOY_USER}@${APP_HOST}" \
            "/opt/airpairy/deployment/blue-green/stage-release-artifacts.sh '${COMMIT}' '${REMOTE_TMP}' && \
             /opt/airpairy/deployment/blue-green/blue-green-deploy.sh '${COMMIT}' 60 && \
             rm -rf ${REMOTE_TMP}"
