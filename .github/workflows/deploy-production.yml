name: Production Deployment (Atomic Blue-Green)

on:
  workflow_dispatch:
    inputs:
      target_commit:
        description: 'Git Commit SHA on main branch to deploy (must have passed CI)'
        required: true
      allow_rollback_deployment:
        description: 'Set to YES to permit deploying an older commit than currently deployed'
        required: false
        default: 'NO'

# contents: checkout; checks: commit check-run query; actions: CI run lookup + artifact download
permissions:
  contents: read
  checks: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  validate-and-deploy:
    name: Validate and Deploy to Production
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    env:
      REMOTE_TMP: /home/matthew/.deploy-staging-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and Validate Target Commit
        id: parse_sha
        env:
          INPUT_COMMIT: ${{ github.event.inputs.target_commit }}
          ALLOW_ROLLBACK: ${{ github.event.inputs.allow_rollback_deployment }}
        run: |
          echo "Resolving target commit ${INPUT_COMMIT}..."
          RESOLVED_COMMIT=$(git rev-parse --verify "${INPUT_COMMIT}^{commit}" 2>/dev/null || true)
          if [ -z "${RESOLVED_COMMIT}" ]; then
            echo "ERROR: Target commit '${INPUT_COMMIT}' could not be resolved!"
            exit 1
          fi

          echo "commit=${RESOLVED_COMMIT}" >> $GITHUB_OUTPUT

          # Ensure commit exists on origin/main
          if ! git merge-base --is-ancestor "${RESOLVED_COMMIT}" origin/main; then
            echo "SECURITY VIOLATION: Target commit ${RESOLVED_COMMIT} is NOT on origin/main branch! Aborting."
            exit 1
          fi

          # Strict Freshness Enforcement: Regular deployment must match current main HEAD
          CURRENT_MAIN_HEAD=$(git rev-parse origin/main)
          echo "Current origin/main HEAD : ${CURRENT_MAIN_HEAD}"
          echo "Target deployment commit : ${RESOLVED_COMMIT}"

          if [ "${RESOLVED_COMMIT}" != "${CURRENT_MAIN_HEAD}" ]; then
            if [ "${ALLOW_ROLLBACK}" = "YES" ]; then
              echo "WARNING: Deploying historical commit (${RESOLVED_COMMIT}) that differs from main HEAD (${CURRENT_MAIN_HEAD}). Explicit rollback flag YES provided."
            else
              echo "STALE COMMIT REJECTED: Candidate commit ${RESOLVED_COMMIT} does not match current main HEAD ${CURRENT_MAIN_HEAD}!"
              echo "To deploy an older commit, you must explicitly set allow_rollback_deployment=YES."
              exit 1
            fi
          else
            echo "Freshness verified: Target commit matches latest origin/main HEAD."
          fi

      - name: Verify CI Build & Test Status for Commit
        id: ci_run
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Checking CI conclusion for commit ${COMMIT}..."
          BACKEND_STATUS=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}/check-runs" \
            -q '.check_runs[] | select(.name=="Backend Build & Tests (Spring Boot)") | .conclusion' | head -n 1)
          FRONTEND_STATUS=$(gh api "repos/${{ github.repository }}/commits/${COMMIT}/check-runs" \
            -q '.check_runs[] | select(.name=="Frontend Build & TypeScript Validation (Next.js)") | .conclusion' | head -n 1)

          echo "Backend CI conclusion  : ${BACKEND_STATUS}"
          echo "Frontend CI conclusion : ${FRONTEND_STATUS}"

          if [ "${BACKEND_STATUS}" != "success" ] || [ "${FRONTEND_STATUS}" != "success" ]; then
            echo "SECURITY VIOLATION: Cannot deploy commit ${COMMIT} because required CI checks are not passing!"
            exit 1
          fi
          echo "CI check runs verified: Both Backend and Frontend passed."

          # Pin the exact CI run: ci.yml, push to main, successful, head_sha == target commit.
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?head_sha=${COMMIT}&branch=main&event=push&status=success&per_page=20" \
            -q "[.workflow_runs[] | select(.head_sha==\"${COMMIT}\" and .path==\".github/workflows/ci.yml\" and .conclusion==\"success\")] | sort_by(.run_number) | last | .id // empty")
          if [ -z "${RUN_ID}" ]; then
            echo "ERROR: No successful ci.yml push run on main found for commit ${COMMIT}!" >&2
            exit 1
          fi

          # Both build jobs inside that specific run must have succeeded.
          JOBS_OK=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/jobs" \
            -q '[.jobs[] | select((.name=="Backend Build & Tests (Spring Boot)" or .name=="Frontend Build & TypeScript Validation (Next.js)") and .conclusion=="success")] | length')
          if [ "${JOBS_OK}" != "2" ]; then
            echo "ERROR: CI run ${RUN_ID} does not contain two successful build jobs for ${COMMIT}!" >&2
            exit 1
          fi
          echo "Pinned CI run ${RUN_ID} for commit ${COMMIT}."
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download Immutable Build Artifacts
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
          RUN_ID: ${{ steps.ci_run.outputs.run_id }}
        run: |
          mkdir -p artifacts
          echo "Downloading artifacts for ${COMMIT} from CI Run ID: ${RUN_ID}..."
          # Only the artifacts named for this exact commit; fails if expired or missing.
          gh run download "${RUN_ID}" \
            -n "backend-jar-${COMMIT}" -n "frontend-bundle-${COMMIT}" --dir artifacts/

          BACKEND_DIR="artifacts/backend-jar-${COMMIT}"
          FRONTEND_DIR="artifacts/frontend-bundle-${COMMIT}"
          for f in "${BACKEND_DIR}/api-0.0.1-SNAPSHOT.jar" "${BACKEND_DIR}/backend.sha256" \
                   "${FRONTEND_DIR}/frontend-standalone.tar.gz" "${FRONTEND_DIR}/frontend.sha256"; do
            [ -f "${f}" ] || { echo "ERROR: Missing artifact file ${f}" >&2; exit 1; }
          done
          # Verify checksums on the runner before anything touches production.
          ( cd "${BACKEND_DIR}" && sha256sum -c backend.sha256 )
          ( cd "${FRONTEND_DIR}" && sha256sum -c frontend.sha256 )

          echo "Inspecting downloaded artifacts:"
          ls -la artifacts/*

      - name: Connect to Tailscale Private Network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-deployer

      - name: Configure Known Hosts with Pinned SSH Key
        env:
          PINNED_HOST_KEY: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${PINNED_HOST_KEY}" ]; then
            echo "CRITICAL SECURITY ERROR: PROD_SSH_KNOWN_HOSTS secret is missing! Failing closed." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Dedicated file: only the pinned production key is trusted for the prod host.
          printf '%s\n' "${PINNED_HOST_KEY}" > ~/.ssh/known_hosts_prod
          chmod 600 ~/.ssh/known_hosts_prod
          echo "Verified and installed repository-pinned SSH host key."

      - name: Set up SSH Key for Deployment
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}

      - name: Configure Strict SSH Client for Production
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
        run: |
          if [ -z "${APP_HOST}" ]; then
            echo "CRITICAL ERROR: PROD_APP_HOST secret is not configured!" >&2
            exit 1
          fi
          # Every ssh/scp below uses "Host prod", so the safeguards apply uniformly.
          cat >> ~/.ssh/config <<EOF
          Host prod
              HostName ${APP_HOST}
              User matthew
              BatchMode yes
              StrictHostKeyChecking yes
              UserKnownHostsFile ~/.ssh/known_hosts_prod
              ConnectTimeout 15
              ServerAliveInterval 15
              ServerAliveCountMax 4
          EOF
          chmod 600 ~/.ssh/config

      - name: Read-Only Production Preflight
        timeout-minutes: 3
        run: |
          echo "Running read-only preflight on production host (no mutations)..."
          ssh prod 'bash -s' <<'EOF_PREFLIGHT'
          set -u
          FAIL=0
          fail() { echo "PREFLIGHT FAIL: $*" >&2; FAIL=1; }
          D=/opt/airpairy/deployment
          APP=/var/www/wifi-billing

          for f in "$D/blue-green/stage-release-artifacts.sh" "$D/blue-green/blue-green-deploy.sh" \
                   /usr/local/bin/deploy-service-control /usr/local/bin/deploy-nginx-control; do
            [ -x "$f" ] || fail "missing or not executable: $f"
          done

          ACTIVE=$(tr -d ' \n' < "$D/state/active_slot.txt" 2>/dev/null || echo legacy)
          # Same slot selection as blue-green-deploy.sh
          case "$ACTIVE" in
            legacy|blue) TARGET=green ;;
            green) TARGET=blue ;;
            *) fail "unexpected active slot '$ACTIVE'"; TARGET=none ;;
          esac
          echo "Active slot: $ACTIVE -> target slot: $TARGET"

          for d in "$D/state" "$D/slots" "$APP" "$APP/slots" "$APP/shared-static"; do
            [ -d "$d" ] && [ -w "$d" ] || fail "directory not writable by $(id -un): $d"
          done
          [ ! -e "$APP/releases" ] || [ -w "$APP/releases" ] || fail "not writable: $APP/releases"

          # sudo -n -l only checks the rule; it executes nothing.
          for c in "deploy-service-control restart backend-$TARGET" "deploy-service-control restart frontend-$TARGET" \
                   "deploy-service-control stop backend-$TARGET" "deploy-service-control stop frontend-$TARGET" \
                   "deploy-nginx-control switch-slot $TARGET"; do
            sudo -n -l /usr/local/bin/$c >/dev/null 2>&1 || fail "no passwordless sudo rule for: $c"
          done
          sudo -n /usr/local/bin/deploy-nginx-control test >/dev/null 2>&1 || fail "nginx configuration test failed"

          AVAIL_KB=$(df -Pk "$APP" | awk 'NR==2 {print $4}')
          [ "${AVAIL_KB:-0}" -ge 2097152 ] || fail "less than 2 GiB free on $APP"

          [ "$FAIL" -eq 0 ] || { echo "Preflight failed; production was not modified." >&2; exit 1; }
          echo "Preflight passed."
          EOF_PREFLIGHT

      - name: Secure Artifact Transfer & Atomic Blue-Green Release
        id: release
        timeout-minutes: 20
        env:
          COMMIT: ${{ steps.parse_sha.outputs.commit }}
        run: |
          echo "Transferring verified immutable artifacts to production..."
          ssh prod "mkdir -p '${REMOTE_TMP}'"

          scp artifacts/"backend-jar-${COMMIT}"/api-0.0.1-SNAPSHOT.jar \
              artifacts/"backend-jar-${COMMIT}"/backend.sha256 \
              artifacts/"frontend-bundle-${COMMIT}"/frontend-standalone.tar.gz \
              artifacts/"frontend-bundle-${COMMIT}"/frontend.sha256 \
              "prod:${REMOTE_TMP}/"

          echo "Executing atomic staging and blue-green cutover via /opt/airpairy/deployment..."
          ssh prod \
            "/opt/airpairy/deployment/blue-green/stage-release-artifacts.sh '${COMMIT}' '${REMOTE_TMP}' && \
             /opt/airpairy/deployment/blue-green/blue-green-deploy.sh '${COMMIT}' 60"

      - name: Remove Remote Staging Directory
        if: always() && steps.release.outcome != 'skipped'
        timeout-minutes: 2
        run: |
          case "${REMOTE_TMP}" in
            /home/matthew/.deploy-staging-*) ssh prod "rm -rf -- '${REMOTE_TMP}'" || echo "WARNING: could not remove ${REMOTE_TMP}" ;;
            *) echo "Refusing to remove unexpected path ${REMOTE_TMP}" ;;
          esac
