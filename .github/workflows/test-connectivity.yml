name: Test Deployment Host Connectivity (Safe Preflight)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connectivity:
    name: Verify Tailscale & SSH Connectivity (Read-Only)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Connect to Tailscale Network
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          tags: tag:ci-deployer

      - name: Configure Known Hosts
        env:
          PINNED_HOST_KEY: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          if [ -z "${PINNED_HOST_KEY}" ]; then
            echo "CRITICAL SECURITY ERROR: PROD_SSH_KNOWN_HOSTS secret is missing! Failing closed." >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${PINNED_HOST_KEY}" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          echo "Verified and installed repository-pinned SSH host key."

      - name: Set up SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.PROD_DEPLOY_SSH_KEY }}

      - name: Harmless Ping & Version Probe
        env:
          APP_HOST: ${{ secrets.PROD_APP_HOST }}
          DEPLOY_USER: "matthew"
        run: |
          if [ -z "${APP_HOST}" ]; then
            echo "CRITICAL ERROR: PROD_APP_HOST secret is not configured!" >&2
            exit 1
          fi
          echo "Executing harmless read-only command on ${DEPLOY_USER}@${APP_HOST}..."
          ssh -o BatchMode=yes "${DEPLOY_USER}@${APP_HOST}" "hostname && uptime && free -h"
          echo "Connectivity test SUCCESSFUL: Tailscale and SSH keys verified."
