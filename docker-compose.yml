services:
  postgres:
    image: postgres:17-alpine
    container_name: wifibilling-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: radius_db
      POSTGRES_USER: radius_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    ports:
      - "127.0.0.1:5439:5432"
    volumes:
      - wifibilling-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radius_user -d radius_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - wifibilling-net

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: wifibilling-backend
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/radius_db
      - SERVER_ADDRESS=0.0.0.0
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wifibilling-net

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: wifibilling-frontend
    restart: unless-stopped
    env_file:
      - ./Frontend/.env
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - BACKEND_INTERNAL_URL=http://backend:8080
    depends_on:
      - backend
    networks:
      - wifibilling-net

volumes:
  wifibilling-pgdata:

networks:
  wifibilling-net:
    driver: bridge
